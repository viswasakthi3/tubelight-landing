# ==============================================================================
# Tubelight Production Nginx Configuration
# File: /etc/nginx/sites-available/tubelight.net
# Covers: tubelight.net, www.tubelight.net, search.tubelight.net
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tubelight.net www.tubelight.net search.tubelight.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Main Landing, Quick Search, and API
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tubelight.net www.tubelight.net search.tubelight.net;

    access_log /var/log/nginx/tubelight.net.access.log;
    error_log /var/log/nginx/tubelight.net.error.log;

    # TLS Certificates (certbot will expand to search.tubelight.net once DNS resolves)
    ssl_certificate /etc/letsencrypt/live/tubelight.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tubelight.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --------------------------------------------------------------------------
    # Cloudflare Trusted Proxy & Real-IP Configuration (Scoped to this vhost)
    # Only trust real-IP headers when arriving from verified Cloudflare CIDRs.
    # Untrusted/direct connections leave $remote_addr as the raw socket peer IP.
    # --------------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # --------------------------------------------------------------------------
    # Upstream Forwarding Headers
    # Overwrite all client-supplied identity headers; strip CF-Connecting-IP to prevent spoofing
    # --------------------------------------------------------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP "";
    # Keep every proxy_set_header at this scope: adding one inside a location
    # suppresses inheritance of the entire trusted Host/IP header set.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # --------------------------------------------------------------------------
    # Desktop App Downloads & Auto-Updates (Static Files)
    # --------------------------------------------------------------------------
    location /updates/ {
        alias /var/www/tubelight_updates/;
        autoindex off;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /download/tubelight.msix {
        alias /var/www/tubelight_updates/Tubelight.msix;
        default_type application/vnd.ms-appx;
        add_header Content-Disposition 'attachment; filename="Tubelight Setup 0.2.1.msix"';
    }

    location = /download/tubelight.exe {
        alias /var/www/tubelight_updates/Tubelight.exe;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="Tubelight Setup 0.2.1.exe"';
    }

    # --------------------------------------------------------------------------
    # Landing API Routes (Forwarded to tubelight-landing:8097)
    # --------------------------------------------------------------------------
    location = /api/preview {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /api/waitlist {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /api/waitlist/ {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /api/panel-auth/ {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ^~ /api/backend/ {
        rewrite ^/api/backend/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Backend API Routes (Forwarded to tubelight-backend:8787)
    # Serves desktop app, billing, instant explanation, search, and internal web explain
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Frontend Next.js Pages (Forwarded to tubelight-landing:8097)
    # Handles /, /search, /download, /upgrade, /checkout
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
